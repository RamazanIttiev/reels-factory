name: make

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many episodes to make"
        default: "3"

concurrency:
  group: reels-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAKE_MODEL: ${{ vars.MAKE_MODEL }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
      GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
      AUDIENCE_TZ: ${{ vars.AUDIENCE_TZ }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PUBLIC_VIDEO_BASE_URL: ${{ secrets.PUBLIC_VIDEO_BASE_URL }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN_EN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_EN }}
      INSTAGRAM_USER_ID_EN: ${{ secrets.INSTAGRAM_USER_ID_EN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Browser libraries for Remotion
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2
      - uses: actions/cache@v4
        with:
          path: .cache
          key: reels-cache-${{ github.run_id }}
          restore-keys: reels-cache-
      - run: npm install -g @anthropic-ai/claude-code
      - name: Make episodes (gate passes means auto-approved)
        run: npm run batch -- --lang ru --count ${{ inputs.count || '3' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "reels-factory bot"
          git config user.email "actions@users.noreply.github.com"
          git add state plan/topics.json facts episodes
          git diff --cached --quiet || (git commit -m "state: new episodes" && git pull --rebase origin main && git push origin HEAD:main)
