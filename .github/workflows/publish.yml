name: publish

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: reels-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
      GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
      AUDIENCE_TZ: ${{ vars.AUDIENCE_TZ }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PUBLIC_VIDEO_BASE_URL: ${{ secrets.PUBLIC_VIDEO_BASE_URL }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN_EN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_EN }}
      INSTAGRAM_USER_ID_EN: ${{ secrets.INSTAGRAM_USER_ID_EN }}
      YOUTUBE_ENABLED: ${{ vars.YOUTUBE_ENABLED }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_RU: ${{ secrets.YT_REFRESH_TOKEN_RU }}
      YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Is a slot open for any language
        id: slot
        run: |
          open=false
          for lang in ru en; do
            npm run -s schedule -- --lang "$lang" --check | tee /tmp/slot.$lang
            grep -q SLOT_OPEN /tmp/slot.$lang && open=true
          done
          echo "open=$open" >> "$GITHUB_OUTPUT"
      - name: Browser libraries for Remotion
        if: steps.slot.outputs.open == 'true'
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2
      - uses: actions/cache@v4
        if: steps.slot.outputs.open == 'true'
        with:
          path: .cache
          key: reels-cache-${{ github.run_id }}
          restore-keys: reels-cache-
      - name: Publish the next video for the open slot
        if: steps.slot.outputs.open == 'true'
        run: npm run schedule -- --lang ru
      - name: Publish the next English video for the open slot
        if: always() && steps.slot.outputs.open == 'true'
        run: npm run schedule -- --lang en
      - name: Save state
        if: always()
        run: |
          git config user.name "reels-factory bot"
          git config user.email "actions@users.noreply.github.com"
          git add state plan/topics.json facts
          git diff --cached --quiet || (git commit -m "state: after scheduled run" && git pull --rebase origin main && git push origin HEAD:main)
